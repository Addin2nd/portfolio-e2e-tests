name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        required: false
        default: 'https://addin-porto.netlify.app'
  schedule:
    # Every day at 06:00 WIB (23:00 UTC), so a broken live site is caught early.
    - cron: '0 23 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://addin-porto.netlify.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
